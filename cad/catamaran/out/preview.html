<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FALCON-01 — Catamaran 3D preview</title>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;background:#08141b;color:#d7e7ee;font:14px/1.5 system-ui,sans-serif}
  #stage{position:fixed;inset:0}
  canvas{display:block}
  #hud{position:fixed;left:16px;top:16px;max-width:330px;background:#0e212ccc;border:1px solid #1e3a47;border-radius:12px;padding:14px 16px;backdrop-filter:blur(6px)}
  #hud h1{font-size:15px;margin:0 0 4px}
  #hud p{margin:0 0 10px;color:#8fb0bd;font-size:12px}
  #hud dl{margin:0;display:grid;grid-template-columns:auto auto;gap:2px 12px;font-size:12.5px}
  #hud dt{color:#8fb0bd}
  #hud dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
  #hud .warn{margin-top:10px;color:#d8a94e;font-size:11.5px;line-height:1.45}
  #msg{position:fixed;inset:0;display:grid;place-items:center;color:#8fb0bd;font-size:13px}
</style>
</head>
<body>
<div id="stage"></div>
<div id="msg">Loading model…</div>
<div id="hud" hidden>
  <h1>FALCON-01 · Catamaran</h1>
  <p>Option B, first-pass geometry</p>
  <dl>
    <dt>Pontoons</dt><dd id="v-pontoon">—</dd>
    <dt>Beam</dt><dd id="v-beam">—</dd>
    <dt>Deck</dt><dd id="v-deck">—</dd>
    <dt>Draft</dt><dd id="v-draft">—</dd>
    <dt>Freeboard</dt><dd id="v-freeboard">—</dd>
    <dt>All-up mass</dt><dd id="v-mass">—</dd>
    <dt>Displacement</dt><dd id="v-capacity">—</dd>
    <dt>Reserve</dt><dd id="v-reserve">—</dd>
    <dt>GM</dt><dd id="v-gm">—</dd>
  </dl>
  <p class="warn">Proposed geometry only. Not a fabrication drawing, not field-validated.</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#08141b');
scene.fog = new THREE.FogExp2('#0b222e', 0.02);

const camera = new THREE.PerspectiveCamera(40, 1, 0.02, 200);
camera.position.set(2.6, 0.9, 2.9);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -0.55, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.maxPolarAngle = Math.PI * 0.62;
controls.minDistance = 0.6;
controls.maxDistance = 22;

scene.add(new THREE.HemisphereLight('#cfe6ef', '#1c2f36', 2.4));
const sun = new THREE.DirectionalLight('#f6e2b6', 3.0);
sun.position.set(-2.2, 3.4, 1.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -2; sun.shadow.camera.right = 2;
sun.shadow.camera.top = 2; sun.shadow.camera.bottom = -2;
scene.add(sun);
const rim = new THREE.DirectionalLight('#8dc4e3', 1.4);
rim.position.set(2.5, 1.2, -2.5);
scene.add(rim);

// Water plane at the computed waterline (y = 0 in the STL, mm).
const water = new THREE.Mesh(
  new THREE.CircleGeometry(6, 96).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: '#12596b', roughness: 0.35, metalness: 0.15, transparent: true, opacity: 0.55 })
);
water.receiveShadow = true;
scene.add(water);

const grid = new THREE.GridHelper(6, 24, '#2b5364', '#1b3947');
grid.material.transparent = true;
grid.material.opacity = 0.35;
grid.position.y = 0.001;
scene.add(grid);

const root = new THREE.Group();
scene.add(root);

new STLLoader().load('./falcon_catamaran.stl', (geo) => {
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({
    color: '#e8821a', roughness: 0.55, metalness: 0.12, side: THREE.DoubleSide
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.scale.setScalar(0.001); // mm -> m
  root.add(mesh);
  document.getElementById('msg').remove();
  document.getElementById('hud').hidden = false;
}, undefined, (err) => {
  document.getElementById('msg').textContent =
    'Could not load falcon_catamaran.stl — serve this folder over http (file:// blocks fetch).';
  console.error(err);
});

// Fill the HUD from the generated analysis instead of hard-coded numbers.
fetch('./hydrostatics.json')
  .then((r) => r.json())
  .then((d) => {
    const g = d.geometry || {};
    const mm = (v) => Math.round(v * 1000);
    const set = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
    if (g.pontoon_diameter_m) {
      set('v-pontoon', `2 × Ø${mm(g.pontoon_diameter_m)} × ${mm(g.pontoon_length_m)} mm`);
      set('v-beam', `${mm(g.pontoon_beam_m)} mm`);
      set('v-deck', `${mm(g.deck_length_m)} × ${mm(g.deck_width_m)} mm`);
    }
    set('v-draft', `${d.draft_mm.toFixed(1)} mm`);
    set('v-freeboard', `${d.freeboard_mm.toFixed(1)} mm`);
    set('v-mass', `${d.total_mass_kg.toFixed(1)} kg`);
    set('v-capacity', `${d.capacity_kg.toFixed(1)} kg`);
    set('v-reserve', `${(d.reserve_buoyancy_fraction * 100).toFixed(1)} %`);
    set('v-gm', `${d.gm_m.toFixed(2)} m`);
  })
  .catch(() => {});

function resize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
addEventListener('resize', resize);
resize();

let t = 0;
renderer.setAnimationLoop(() => {
  t += 0.006;
  // gentle sea motion, visual only
  root.rotation.z = Math.sin(t) * 0.012;
  root.rotation.x = Math.cos(t * 0.8) * 0.008;
  root.position.y = Math.sin(t * 0.9) * 0.006;
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
