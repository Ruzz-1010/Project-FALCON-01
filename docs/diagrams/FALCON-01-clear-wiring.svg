<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<style>
.bg{fill:#f4f6f7}.box{fill:#fff;stroke:#9aa8b1;stroke-width:2}.core{fill:#e7eef2;stroke:#405d6b;stroke-width:3}.pow{fill:#fff6e3;stroke:#9d742a;stroke-width:2}.h{font:700 19px Arial;fill:#1e303a}.title{font:700 29px Arial;fill:#172832}.t{font:14px Arial;fill:#334953}.p{font:700 13px monospace;fill:#263b45}.s{font:12px Arial;fill:#61737d}.i2c{stroke:#3f7e8b;stroke-width:6;fill:none}.spi{stroke:#725fa4;stroke-width:6;fill:none}.uart{stroke:#4e8561;stroke-width:6;fill:none}.sig{stroke:#6b7c87;stroke-width:5;fill:none}.power{stroke:#b07925;stroke-width:7;fill:none}.high{stroke:#9d4b43;stroke-width:8;stroke-dasharray:12 8;fill:none}
</style>
<rect class="bg" width="1600" height="1000"/><text class="title" x="42" y="48">FALCON-01 · Clear Bench Wiring</text><text class="s" x="42" y="72">3.3 V logic · verify plug view · disconnect all sources before rewiring</text>

<rect class="box" x="35" y="105" width="440" height="300" rx="14"/><text class="h" x="60" y="140">BNO085 PID 4754 · SPI</text>
<text class="p" x="60" y="180">A1 VIN  → 3V3       B2 PS0  → 3V3</text><text class="p" x="60" y="210">A3 GND  → GND       B3 PS1  → 3V3</text>
<text class="p" x="60" y="240">A4 SCK  → GPIO18    B4 RST  → GPIO14</text><text class="p" x="60" y="270">A5 MISO → GPIO19    B5 MOSI → GPIO23</text>
<text class="p" x="60" y="300">A6 INT  → GPIO27    B6 CS   → GPIO13</text><text class="s" x="60" y="335">A2 3Vo and B1 BOOT: leave electrically open.</text>
<text class="s" x="60" y="365">Rigid mount; label axes; keep away from fan/power loops.</text><path class="spi" d="M475 255 H570"/>

<rect class="core" x="570" y="105" width="455" height="585" rx="18"/><text class="h" x="598" y="145">ESP32-DevKitC V4 · WROOM-32E</text><text class="s" x="598" y="170">Socketed controller · antenna end at board edge</text>
<text class="h" x="598" y="212">BUS PINS</text><text class="p" x="598" y="242">I²C: SDA21 · SCL22</text><text class="p" x="598" y="272">SPI: SCK18 · MISO19 · MOSI23</text><text class="p" x="598" y="302">BNO: CS13 · INT27 · RST14</text>
<text class="h" x="598" y="350">UART / INPUTS</text><text class="p" x="598" y="380">RX16 ← GPS TX · TX17 → GPS RX</text><text class="p" x="598" y="410">GPIO25 ← anemometer pulse</text><text class="p" x="598" y="440">GPIO26 ↔ DS18B20 DQ</text><text class="p" x="598" y="470">GPIO32 ← leak signal (TBD)</text><text class="p" x="598" y="500">GPIO33 → fan MOSFET stage</text>
<text class="h" x="598" y="550">POWER / HOST</text><text class="p" x="598" y="580">Protected 5V + GND</text><text class="p" x="598" y="610">USB serial → Orange Pi</text><text class="s" x="598" y="650">No raw 12.8 V and no direct fan load on GPIO.</text>

<rect class="box" x="1120" y="105" width="440" height="300" rx="14"/><text class="h" x="1145" y="140">Shared I²C trunk · 3.3 V</text><text class="p" x="1145" y="175">SDA → GPIO21 · SCL → GPIO22</text>
<text class="t" x="1145" y="210">Bar02 · 0x76</text><text class="p" x="1165" y="235">JST-GH: 1 VIN · 2 SCL · 3 SDA · 4 GND</text><text class="t" x="1145" y="270">INA260 BAT 0x40 · INA260 SOLAR 0x41</text><text class="t" x="1145" y="300">MCP9808 0x18 · ADS1115 0x48</text><text class="s" x="1145" y="335">Audit pull-ups. Add one board, then scan the bus.</text><text class="s" x="1145" y="365">INA260 load terminals are not logic pins.</text><path class="i2c" d="M1025 255 H1120"/>

<rect class="box" x="1120" y="435" width="440" height="145" rx="14"/><text class="h" x="1145" y="470">Ultimate GPS PID 746 · UART2</text><text class="p" x="1145" y="505">Pin 2 VIN → 3V3 · Pin 3 GND → GND</text><text class="p" x="1145" y="535">Pin 5 TX → GPIO16 · Pin 4 RX ← GPIO17</text><path class="uart" d="M1025 475 H1120"/>

<rect class="box" x="1120" y="610" width="440" height="190" rx="14"/><text class="h" x="1145" y="645">External sensor inputs</text><text class="p" x="1145" y="680">Reed: GPIO25 ↔ GND · 10k pull-up</text><text class="p" x="1145" y="710">Vane midpoint → ADS1115 A0</text><text class="p" x="1145" y="740">DS18B20 DQ → GPIO26 · 4.7k pull-up</text><text class="s" x="1145" y="770">Leak sensor and fan remain TBD until parts are selected.</text><path class="sig" d="M1025 520 C1080 520 1070 690 1120 690"/>

<rect class="box" x="35" y="435" width="440" height="255" rx="14"/><text class="h" x="60" y="470">Line key / safe sequence</text><path class="i2c" d="M65 505 H125"/><text class="t" x="145" y="511">I²C</text><path class="spi" d="M65 540 H125"/><text class="t" x="145" y="546">BNO SPI/control</text><path class="uart" d="M65 575 H125"/><text class="t" x="145" y="581">UART / USB</text><path class="sig" d="M65 610 H125"/><text class="t" x="145" y="616">Sensor signal</text><text class="s" x="260" y="510">1. Meter both rails.</text><text class="s" x="260" y="540">2. Power ESP32 only.</text><text class="s" x="260" y="570">3. Add one sensor.</text><text class="s" x="260" y="600">4. Test, then continue.</text><text class="s" x="60" y="655">Wire color is only a guide—trust verified pin labels and continuity.</text>

<rect class="pow" x="35" y="835" width="1525" height="125" rx="15"/><text class="h" x="60" y="870">HIGH-CURRENT POWER PATH — physically separate from carrier signal headers</text><text class="p" x="60" y="915">SOLAR → MPPT → 12.8 V BATTERY → MAIN FUSE / DISCONNECT → DISTRIBUTION</text><path class="high" d="M650 910 H810"/><text class="p" x="845" y="900">→ dedicated 5V/≥3A buck → Orange Pi</text><text class="p" x="845" y="930">→ separate 5V buck → carrier / ESP32</text><text class="s" x="60" y="945">INA260 BAT and SOLAR load terminals stay in separately reviewed, fused external paths.</text>
</svg>
