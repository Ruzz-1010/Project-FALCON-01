<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Project FALCON adviser-revised architecture</title><desc id="desc">Pressure and coastal sensors connect to ESP32, then USB UART to Orange Pi local services and dashboard.</desc>
  <rect width="1400" height="820" fill="#f4f7f6"/><style>.box{fill:#fff;stroke:#385f66;stroke-width:2}.core{fill:#e5f1f2}.security{fill:#f4ece0}.edge{fill:#e9eef5}.t{font:700 22px sans-serif;fill:#17373d}.s{font:16px sans-serif;fill:#36565c}.a{stroke:#527c83;stroke-width:4;fill:none;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#527c83"/></marker></defs>
  <text x="70" y="60" class="t" font-size="30">PROJECT FALCON-01 · PHASE 1 MONITORING ARCHITECTURE</text>
  <rect class="box core" x="70" y="120" rx="18" width="330" height="360"/><text class="t" x="100" y="165">COASTAL SENSORS</text>
  <text class="s" x="100" y="210">CORE</text><text class="s" x="120" y="245">• Bar02 pressure</text><text class="s" x="120" y="278">• GPS</text><text class="s" x="120" y="311">• Wind speed / direction</text>
  <text class="s" x="100" y="355">SUPPORTING</text><text class="s" x="120" y="390">• DS18B20 water temperature</text><text class="s" x="120" y="423">• Conductivity / salinity indicator</text><text class="s" x="100" y="460">ESTIMATED · CALIBRATION REQUIRED</text>
  <rect class="box security" x="70" y="520" rx="18" width="330" height="220"/><text class="t" x="100" y="565">SECURITY + HEALTH</text><text class="s" x="120" y="610">• Tamper / enclosure switch / buzzer</text><text class="s" x="120" y="645">• Battery / solar / enclosure temp</text><text class="s" x="120" y="680">• GPS geofence persistence</text><text class="s" x="120" y="715">SECURE · WARNING · ALERT</text>
  <rect class="box" x="520" y="250" rx="18" width="280" height="250"/><text class="t" x="575" y="300">ESP32</text><text class="s" x="555" y="345">Acquire + timestamp</text><text class="s" x="555" y="378">Validate + calibrate</text><text class="s" x="555" y="411">Debounce security</text><text class="s" x="555" y="444">Versioned telemetry</text>
  <rect class="box edge" x="920" y="150" rx="18" width="400" height="420"/><text class="t" x="980" y="200">ORANGE PI ZERO 3</text><text class="s" x="965" y="245">USB serial / UART ingestion</text><text class="s" x="965" y="280">Pressure filtering + wave estimate</text><text class="s" x="965" y="315">GPS geofence rules</text><text class="s" x="965" y="350">SQLite telemetry + events</text><text class="s" x="965" y="385">REST API + local dashboard</text><text class="s" x="965" y="420">Rule-based FALCON Assistant</text><text class="s" x="965" y="455">Optional isolated AI</text><text class="s" x="965" y="520">No Internet required</text>
  <rect class="box" x="970" y="640" rx="18" width="300" height="100"/><text class="t" x="1010" y="685">3-PAGE DASHBOARD</text><text class="s" x="1000" y="720">Overview · Sensors · Logs &amp; Alerts</text>
  <path class="a" d="M400 300 H520"/><path class="a" d="M400 630 C470 630 470 450 520 450"/><path class="a" d="M800 370 H920"/><path class="a" d="M1120 570 V640"/>
  <text class="s" x="815" y="350">USB / UART</text><text class="s" x="490" y="790">BNO085 optional/deprecated · no load cell/HX711 · passive mooring</text>
</svg>
