<rect class="bg" width="1400" height="900"/><text class="h" x="45" y="48" style="font-size:28px">FALCON-01 · Bench Wiring v0.1</text><text class="s" x="45" y="72">3.3 V logic · verify exact boards before power · final marine fuses/cables TBD</text>
<rect class="e" x="520" y="220" width="360" height="410" rx="18"/><text class="h" x="550" y="260">ESP32 DevKit / ESP-WROOM-32</text><text class="t" x="550" y="300">I²C: SDA21 · SCL22</text><text class="t" x="550" y="335">SPI: SCK18 · MISO19 · MOSI23</text><text class="t" x="550" y="370">BNO085: CS13 · INT27 · RST14</text><text class="t" x="550" y="405">GPS UART2: RX16 · TX17</text><text class="t" x="550" y="440">Anemometer: GPIO25 + 10 kΩ pull-up</text><text class="t" x="550" y="475">Optional DS18B20: GPIO26 + 4.7 kΩ</text><text class="t" x="550" y="510">Leak input: GPIO32</text><text class="t" x="550" y="545">Reserved fan driver: GPIO33</text><text class="t" x="550" y="585">USB: programming + Orange Pi telemetry</text><text class="s" x="550" y="610">No raw 12.8 V or 5 V signals on GPIO.</text>
