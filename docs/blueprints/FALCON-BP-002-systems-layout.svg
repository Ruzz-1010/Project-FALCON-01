<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs><style>
    .bg{fill:#071b2b}.grid{stroke:#123650;stroke-width:1}.box{fill:#0b2940;stroke:#9ee8ff;stroke-width:2}.power{fill:#2c2a18;stroke:#ffd166;stroke-width:2}.data{fill:#102d42;stroke:#70d6ff;stroke-width:2}.sensor{fill:#12352f;stroke:#75e3bd;stroke-width:2}.line{fill:none;stroke:#9ee8ff;stroke-width:2}.pwr{fill:none;stroke:#ffd166;stroke-width:3}.dat{fill:none;stroke:#70d6ff;stroke-width:3}.title{fill:#fff;font:bold 31px sans-serif}.head{fill:#9ee8ff;font:bold 18px sans-serif}.txt{fill:#dff7ff;font:18px sans-serif}.small{fill:#b9d9e6;font:14px sans-serif}.micro{fill:#91b8c8;font:12px sans-serif}.warn{fill:#ffd166;font:bold 15px sans-serif}.bad{fill:#ff8d8d;font:bold 15px sans-serif}.stamp{fill:none;stroke:#ff7474;stroke-width:3}.stamptext{fill:#ff8d8d;font:bold 21px sans-serif;letter-spacing:2px}
  </style><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" class="grid" fill="none"/></pattern><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#70d6ff"/></marker><marker id="p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#ffd166"/></marker></defs>
  <rect width="1600" height="1100" class="bg"/><rect width="1600" height="1100" fill="url(#g)" opacity=".55"/>
  <text x="55" y="57" class="title">PROJECT FALCON — SYSTEMS &amp; INTERNAL LAYOUT</text><text x="55" y="86" class="small">FALCON-BP-002 · FUNCTIONAL PLACEMENT · V2 CAD REFERENCE</text>
  <g transform="translate(55 135)">
    <text class="head">SEALED ELECTRONICS POD — 300 × 280 × 400 CAD REF</text>
    <rect x="0" y="25" width="700" height="590" rx="24" class="box"/>
    <rect x="25" y="50" width="650" height="170" rx="12" class="power"/><text x="45" y="80" class="warn">LOWER POWER DECK</text>
    <rect x="45" y="100" width="170" height="90" rx="8" class="power"/><text x="62" y="135" class="txt">12 V LiFePO₄</text><text x="62" y="160" class="small">battery + BMS</text>
    <rect x="235" y="100" width="120" height="90" rx="8" class="power"/><text x="260" y="137" class="txt">MPPT</text><text x="249" y="162" class="small">solar input</text>
    <rect x="375" y="100" width="120" height="90" rx="8" class="power"/><text x="395" y="137" class="txt">DC–DC</text><text x="392" y="162" class="small">regulated rail</text>
    <rect x="515" y="100" width="140" height="90" rx="8" class="power"/><text x="535" y="137" class="txt">Fuse + switch</text><text x="548" y="162" class="small">distribution</text>
    <rect x="25" y="245" width="650" height="185" rx="12" class="data"/><text x="45" y="275" class="head">UPPER CONTROL DECK</text>
    <rect x="45" y="300" width="170" height="95" rx="8" class="data"/><text x="78" y="342" class="txt">ESP32</text><text x="62" y="368" class="small">sensor acquisition</text>
    <rect x="240" y="300" width="170" height="95" rx="8" class="data"/><text x="274" y="342" class="txt">LTE modem</text><text x="264" y="368" class="small">cellular uplink</text>
    <rect x="435" y="300" width="200" height="95" rx="8" class="data"/><text x="460" y="342" class="txt">Sensor interface</text><text x="474" y="368" class="small">protected I/O</text>
    <path d="M215 145H235M355 145H375M495 145H515M585 190V300" class="pwr" marker-end="url(#p)"/><path d="M215 347H240M410 347H435" class="dat" marker-end="url(#a)"/>
    <rect x="25" y="455" width="650" height="125" rx="12" class="box"/><text x="45" y="486" class="head">SERVICE / ENVIRONMENT</text><text x="45" y="522" class="small">IP68 downward cable glands · leak tray · membrane vent</text><text x="45" y="550" class="small">EPDM dual seals · rear thermal interface · service clearances TBD</text>
    <path d="M50 595H650" stroke="#ff7474" stroke-width="3"/><text x="65" y="610" class="bad">NO ORANGE PI ON BUOY — located at shore Bay Station</text>
  </g>
  <g transform="translate(815 135)">
    <text class="head">SENSOR &amp; COMMUNICATION PLACEMENT</text>
    <rect y="25" width="730" height="300" rx="18" class="box"/>
    <rect x="25" y="60" width="170" height="70" rx="10" class="sensor"/><text x="58" y="91" class="txt">Wind sensor</text><text x="54" y="114" class="small">top platform</text>
    <rect x="220" y="60" width="140" height="70" rx="10" class="sensor"/><text x="264" y="91" class="txt">GNSS</text><text x="245" y="114" class="small">clear sky view</text>
    <rect x="385" y="60" width="140" height="70" rx="10" class="data"/><text x="430" y="91" class="txt">LTE</text><text x="406" y="114" class="small">antenna separation</text>
    <rect x="550" y="60" width="150" height="70" rx="10" class="sensor"/><text x="575" y="91" class="txt">Nav. light</text><text x="575" y="114" class="small">360° visibility</text>
    <rect x="25" y="170" width="210" height="90" rx="10" class="sensor"/><text x="50" y="207" class="txt">Water temperature</text><text x="51" y="233" class="small">sealed probe · TBD mount</text>
    <rect x="260" y="170" width="210" height="90" rx="10" class="sensor"/><text x="292" y="207" class="txt">Pressure sensor</text><text x="281" y="233" class="small">underwater guard assembly</text>
    <rect x="495" y="170" width="205" height="90" rx="10" class="sensor"/><text x="533" y="207" class="txt">Power monitors</text><text x="520" y="233" class="small">battery + solar current</text>
    <text x="25" y="298" class="small">Enclosure health/security inputs are internal; final device models and connector clearances TBD.</text>
  </g>
  <g transform="translate(815 505)">
    <text class="head">UNDERWATER PRESSURE ASSEMBLY</text><rect y="25" width="340" height="300" rx="18" class="box"/>
    <rect x="40" y="65" width="260" height="24" class="box"/><path d="M80 89V135M260 89V135" class="line"/><rect x="58" y="135" width="224" height="25" class="box"/>
    <ellipse cx="170" cy="185" rx="65" ry="18" class="sensor"/><path d="M105 185V255M235 185V255" class="line"/><ellipse cx="170" cy="255" rx="65" ry="18" class="sensor"/>
    <rect x="146" y="190" width="48" height="65" rx="18" class="sensor"/><path d="M170 255V290" class="dat" marker-end="url(#a)"/>
    <text x="28" y="310" class="small">Ø24 × 42 sensor · Ø64 × 72 guard</text>
  </g>
  <g transform="translate(1195 505)">
    <text class="head">END-TO-END DATA FLOW</text><rect y="25" width="350" height="300" rx="18" class="box"/>
    <rect x="25" y="60" width="120" height="55" rx="8" class="sensor"/><text x="49" y="94" class="txt">Sensors</text>
    <rect x="205" y="60" width="120" height="55" rx="8" class="data"/><text x="235" y="94" class="txt">ESP32</text><path d="M145 87H205" class="dat" marker-end="url(#a)"/>
    <rect x="205" y="145" width="120" height="55" rx="8" class="data"/><text x="226" y="179" class="txt">LTE link</text><path d="M265 115V145" class="dat" marker-end="url(#a)"/>
    <rect x="25" y="145" width="120" height="55" rx="8" class="data"/><text x="42" y="179" class="txt">Bay Station</text><path d="M205 172H145" class="dat" marker-end="url(#a)"/>
    <rect x="25" y="230" width="120" height="55" rx="8" class="data"/><text x="54" y="264" class="txt">AI/API</text><path d="M85 200V230" class="dat" marker-end="url(#a)"/>
    <rect x="205" y="230" width="120" height="55" rx="8" class="data"/><text x="218" y="264" class="txt">Dashboard</text><path d="M145 257H205" class="dat" marker-end="url(#a)"/>
  </g>
  <g transform="translate(485 930) rotate(-6)"><rect x="-280" y="-45" width="560" height="90" rx="8" class="stamp"/><text x="-242" y="9" class="stamptext">REFERENCE · NOT FOR FABRICATION</text></g>
  <g transform="translate(55 1000)"><rect width="1490" height="70" class="box"/><text x="18" y="28" class="small">DRAWING: FALCON-BP-002</text><text x="300" y="28" class="small">REV: P0</text><text x="450" y="28" class="small">SCALE: NTS</text><text x="650" y="28" class="small">SOURCE: FUSION V2 WORKING REFERENCE</text><text x="18" y="55" class="micro">Actual part envelopes, connectors, thermal load, cable routing and service clearances must be measured before layout approval.</text></g>
</svg>
