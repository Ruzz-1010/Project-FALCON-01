    <rect x="-150" y="-345" width="300" height="400" rx="30" class="part"/>
    <path d="M-210 70-155-345M210 70 155-345M-155-345-95-725M155-345 95-725" class="line"/>
    <path d="M-190-80 190-80M-175-210 175-210M-110-620 110-620M-198-80 170-210M198-80-170-210M-150-345 120-620M150-345-120-620" class="thin"/>
    <path d="M-120-520-285-390-250-145-75-275Z" class="solar"/><path d="M120-520 285-390 250-145 75-275Z" class="solar"/>
