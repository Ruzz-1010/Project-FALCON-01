    <text x="5" y="452" class="warn">DESIGN BASIS</text>
    <text x="5" y="482" class="small">Existing Fusion V2 model analyzed on 2026-08-30.</text>
    <text x="5" y="510" class="small">Geometry is a proposed reference—not deployment validated.</text>
    <text x="5" y="538" class="small">Orange Pi excluded: shore-based Bay Station only.</text>
  </g>
  <g transform="translate(1110 930) rotate(-8)"><rect x="-280" y="-45" width="560" height="90" rx="8" class="stamp"/><text x="-242" y="9" class="stamptext">REFERENCE · NOT FOR FABRICATION</text></g>
  <g transform="translate(55 1000)"><rect width="1490" height="70" class="call"/><text x="18" y="28" class="small">DRAWING: FALCON-BP-001</text><text x="300" y="28" class="small">REV: P0</text><text x="450" y="28" class="small">SCALE: NTS</text><text x="650" y="28" class="small">UNITS: mm</text><text x="850" y="28" class="small">STATUS: PROPOSED REPLACEMENT PROTOTYPE</text><text x="18" y="55" class="micro">Verify actual dimensions, loaded waterline, stability, material, fasteners and component clearances before release.</text></g>
