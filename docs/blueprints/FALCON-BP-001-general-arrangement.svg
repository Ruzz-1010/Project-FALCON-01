<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <style>
      .bg{fill:#071b2b}.grid{stroke:#123650;stroke-width:1}.line{fill:none;stroke:#9ee8ff;stroke-width:3}.thin{fill:none;stroke:#65b8d4;stroke-width:1.5}.dim{fill:none;stroke:#ffd166;stroke-width:1.5}.dash{stroke-dasharray:8 7}.txt{fill:#dff7ff;font:20px 'DejaVu Sans',sans-serif}.small{fill:#b9d9e6;font:15px 'DejaVu Sans',sans-serif}.micro{fill:#91b8c8;font:12px 'DejaVu Sans',sans-serif}.title{fill:#fff;font:bold 31px 'DejaVu Sans',sans-serif}.head{fill:#9ee8ff;font:bold 18px 'DejaVu Sans',sans-serif}.warn{fill:#ffd166;font:bold 16px 'DejaVu Sans',sans-serif}.part{fill:#0b2940;stroke:#9ee8ff;stroke-width:2}.water{fill:#0c4160;opacity:.55;stroke:#58b9dd;stroke-width:2}.solar{fill:#143d67;stroke:#ffd166;stroke-width:3}.call{fill:#071b2b;stroke:#65b8d4;stroke-width:1}.num{fill:#ffd166;font:bold 16px sans-serif}.stamp{fill:none;stroke:#ff7474;stroke-width:3}.stamptext{fill:#ff8d8d;font:bold 21px sans-serif;letter-spacing:2px}
    </style>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" class="grid" fill="none"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M8 4 0 0v8z" fill="#ffd166"/></marker>
  </defs>
  <rect width="1600" height="1100" class="bg"/><rect width="1600" height="1100" fill="url(#g)" opacity=".55"/>
