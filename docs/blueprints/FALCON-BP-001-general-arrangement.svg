    <circle cx="0" cy="-825" r="28" class="part"/><path d="M-90-865h45m-22-35v70M90-865h45m-22-35v70" class="thin"/>
    <path d="M0 330V470" class="line"/><ellipse cx="0" cy="490" rx="105" ry="28" class="part"/><rect x="-105" y="490" width="210" height="70" class="part"/><ellipse cx="0" cy="560" rx="105" ry="28" class="part"/>
