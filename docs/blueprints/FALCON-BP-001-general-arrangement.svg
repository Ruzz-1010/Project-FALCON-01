    <circle cx="0" cy="0" r="30" class="part"/><text x="-25" y="6" class="small">GPS</text>
    <circle cx="85" cy="-80" r="34" class="part"/><text x="72" y="-74" class="small">W</text>
    <rect x="-118" y="58" width="24" height="92" class="part"/><text x="-155" y="170" class="micro">LTE ANT.</text>
    <rect x="94" y="58" width="24" height="92" class="part"/><text x="80" y="170" class="micro">Wi-Fi REF.</text>
    <path d="M-150-145 150 145M150-145-150 145" class="thin"/>
  </g>
  <g transform="translate(800 570)">
    <text x="0" y="0" class="head">COMPONENT CALLOUTS</text>
    <g class="small">
      <text x="0" y="42"><tspan class="num">01</tspan> Wind speed/direction sensor</text>
      <text x="0" y="76"><tspan class="num">02</tspan> GNSS/GPS antenna</text>
      <text x="0" y="110"><tspan class="num">03</tspan> LTE/cellular antenna</text>
      <text x="0" y="144"><tspan class="num">04</tspan> Navigation light / lightning terminal</text>
      <text x="0" y="178"><tspan class="num">05</tspan> 2 × 30 W solar modules (CAD reference)</text>
      <text x="0" y="212"><tspan class="num">06</tspan> Sealed UV-HDPE electronics pod</text>
      <text x="0" y="246"><tspan class="num">07</tspan> 6061-T6 tapered mast and support cage</text>
      <text x="0" y="280"><tspan class="num">08</tspan> Ø650 HDPE float and tapered keel</text>
      <text x="0" y="314"><tspan class="num">09</tspan> BAR02-compatible pressure sensor + guard</text>
      <text x="0" y="348"><tspan class="num">10</tspan> Adjustable ballast and passive mooring</text>
      <text x="0" y="382"><tspan class="num">11</tspan> Concrete anchor (size/mass require approval)</text>
